<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 240px; height: 300px; background: transparent; overflow: hidden; }
    #panel {
      margin: 6px;
      background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-family: monospace;
      color: #e8e8e8;
      display: flex;
      flex-direction: column;
      max-height: 288px;
    }
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    #header .title { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.05em; }
    #btn-add {
      background: none;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 5px;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      line-height: 1;
      padding: 1px 6px;
      cursor: pointer;
      transition: color 0.1s, border-color 0.1s;
    }
    #btn-add:hover { color: #e8e8e8; border-color: rgba(255,255,255,0.4); }
    #list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    #list::-webkit-scrollbar { width: 4px; }
    #list::-webkit-scrollbar-track { background: transparent; }
    #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .project-row {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.1s;
      position: relative;
    }
    .project-row:hover { background: rgba(255,255,255,0.07); }
    .project-row .info { flex: 1; overflow: hidden; }
    .project-row .name {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .project-row .path {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .trash {
      opacity: 0;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      padding: 2px 4px;
      border-radius: 4px;
      transition: opacity 0.1s, color 0.1s;
      flex-shrink: 0;
    }
    .project-row:hover .trash { opacity: 1; }
    .trash:hover { color: #ff6b6b; }
    #empty {
      padding: 20px 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="panel">
    <div id="header">
      <span class="title">PROJECTS</span>
      <button id="btn-add">+</button>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const list = document.getElementById('list');
    let projects = [];

    function shortenPath(p) {
      return p.replace(/^\/Users\/[^/]+/, '~');
    }

    function render() {
      list.innerHTML = '';
      if (projects.length === 0) {
        list.innerHTML = '<div id="empty">No projects yet<br>Press + to add one</div>';
        return;
      }
      projects.forEach(p => {
        const row = document.createElement('div');
        row.className = 'project-row';

        const info = document.createElement('div');
        info.className = 'info';
        info.innerHTML = `<div class="name">${p.name}</div><div class="path">${shortenPath(p.path)}</div>`;

        const trash = document.createElement('span');
        trash.className = 'trash';
        trash.textContent = '✕';
        trash.title = 'Remove';
        trash.addEventListener('click', async (e) => {
          e.stopPropagation();
          projects = await window.panelAPI.removeProject(p.id);
          render();
        });

        row.appendChild(info);
        row.appendChild(trash);
        row.addEventListener('click', () => {
          window.panelAPI.openProject(p.path);
        });

        list.appendChild(row);
      });
    }

    // Load projects and render
    window.panelAPI.getProjects().then(data => {
      projects = data;
      render();
    });

    document.getElementById('btn-add').addEventListener('click', async () => {
      const picked = await window.panelAPI.pickDirectory();
      if (picked) {
        projects = await window.panelAPI.addProject(picked);
        render();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.panelAPI.closePanel();
    });
  </script>
</body>
</html>
