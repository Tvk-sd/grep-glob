<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greg & Glop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 200px;
      height: 200px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #wrapper {
      position: relative;
      width: 160px;
      height: 160px;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    #badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #e8e8e8;
      font-family: monospace;
      font-size: 10px;
      padding: 2px 6px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #badge.visible { opacity: 1; }
    #badge.error { color: #ff6b6b; border-color: rgba(255,107,107,0.4); }
  </style>
</head>
<body>
  <div id="wrapper">
    <canvas id="c" width="160" height="160"></canvas>
    <div id="badge"></div>
  </div>

  <script>
    const sources = [
      'assets/Group 5.png',   // 0
      'assets/Group 6.png',   // 1 — grep frame
      'assets/Group 7.png',   // 2
      'assets/Group 8.png',   // 3 — glob frame
      'assets/Group 9.png',   // 4
      'assets/Group 10.png',  // 5 — idle frame
    ];

    const FRAME = { idle: 5, grep: 1, glob: 3, error: 0 };
    const MAX_W = 806, MAX_H = 682, CANVAS_SIZE = 160;
    const FRAME_DELAY = 150;
    const scale = CANVAS_SIZE / Math.max(MAX_W, MAX_H);

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const badge  = document.getElementById('badge');

    const imgs = [];
    let loaded = 0;
    sources.forEach((src, i) => {
      const img = new Image();
      img.src = src;
      img.onload = () => { if (++loaded === sources.length) start(); };
      imgs[i] = img;
    });

    // ── Animation state ───────────────────────────────────────────────────────

    let loopTimer  = null;
    let active     = false;
    let started    = false;
    let lockedFrame = null;   // non-null: external state holds this frame
    let badgeTimer = null;
    let current    = FRAME.idle;

    function draw(i) {
      const img = imgs[i];
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.drawImage(img, (CANVAS_SIZE - w) / 2, CANVAS_SIZE - h, w, h);
    }

    function startLoop() {
      if (active || lockedFrame !== null) return;
      active = true;
      current = 0;
      function next() {
        if (!active) return;
        draw(current);
        current = (current + 1) % imgs.length;
        loopTimer = setTimeout(next, FRAME_DELAY);
      }
      next();
    }

    function stopLoop() {
      active = false;
      clearTimeout(loopTimer);
      loopTimer = null;
      if (lockedFrame === null) draw(FRAME.idle);
    }

    function lockFrame(i) {
      active = false;
      clearTimeout(loopTimer);
      loopTimer = null;
      lockedFrame = i;
      draw(i);
    }

    function unlock() {
      lockedFrame = null;
      current = FRAME.idle;
      draw(FRAME.idle);
    }

    function pulse() {
      const base = lockedFrame ?? FRAME.idle;
      draw((base + 1) % imgs.length);
      setTimeout(() => draw(base), 100);
    }

    // ── Shrine state from main process ────────────────────────────────────────

    window.electronAPI.onShrineState((state) => {
      if      (state === 'idle')      unlock();
      else if (state === 'grep')      lockFrame(FRAME.grep);
      else if (state === 'glob')      lockFrame(FRAME.glob);
      else if (state === 'searching') { lockedFrame = null; startLoop(); }
      else if (state === 'found')     lockFrame(FRAME.grep);
      else if (state === 'error')     lockFrame(FRAME.error);
    });

    window.electronAPI.onGrepResult((result) => {
      clearTimeout(badgeTimer);
      badge.className = 'visible' + (result.error ? ' error' : '');
      badge.textContent = result.error
        ? '!'
        : `${result.count} match${result.count !== 1 ? 'es' : ''}`;
      badgeTimer = setTimeout(() => {
        badge.className = '';
        unlock();
      }, 8000);
    });

    // ── Input ─────────────────────────────────────────────────────────────────

    function start() {
      if (started) return;
      started = true;
      draw(FRAME.idle);

      canvas.addEventListener('mouseenter', startLoop);
      canvas.addEventListener('mouseleave', stopLoop);

      canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        window.electronAPI.openContextMenu();
      });

      canvas.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;

        const startX = e.screenX, startY = e.screenY;
        const offsetX = e.screenX - window.screenX;
        const offsetY = e.screenY - window.screenY;
        let dragged = false;

        function onMove(ev) {
          if (Math.abs(ev.screenX - startX) > 5 || Math.abs(ev.screenY - startY) > 5) {
            dragged = true;
          }
          if (dragged) window.electronAPI.moveWindow(ev.screenX - offsetX, ev.screenY - offsetY);
        }

        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          if (!dragged) {
            pulse();
            window.electronAPI.openTerminal();
          }
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }
  </script>
</body>
</html>
