<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animated pixel house — design check</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f4f4; display: grid; place-items: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 8px 24px rgba(0,0,0,.12); max-width: min(100vw - 2rem, 96vw); height: auto; }
    p { font: 12px/1.4 system-ui, sans-serif; color: #555; max-width: 28rem; margin: 0 1rem 1rem; text-align: center; }
  </style>
</head>
<body>
  <div>
    <p>Open this file locally. Tweak constants in the script block (PIXEL_SIZE, speeds, intervals).</p>
    <canvas id="c" width="520" height="520" aria-label="Animated pixel house"></canvas>
  </div>
  <script>
    // --- tuning (design check) ---
    const PIXEL_SIZE = 10;
    const PULSE_HZ = 0.35;
    const SNAKE_CELLS_PER_SEC = 14;
    const SNAKE_LENGTH = 5;
    const SMOKE_RISE_PER_SEC = 18;
    const SMOKE_DRIFT = 2.2;
    /** How long each “snake emphasis” beat lasts (dims non-snake pixels). */
    const SNAKE_EMPHASIS_MS = 2200;
    /** Cadence for snake emphasis (same as plan’s MODE_INTERVAL_MS). */
    const SNAKE_EMPHASIS_EVERY_MS = 4200;

    const COLORS = {
      K: [20, 20, 22],
      W: [255, 255, 255],
      R: [220, 40, 40],
      G: [50, 180, 80],
      B: [55, 95, 220],
    };

    /*
     * ASCII art source (one char = one logical pixel).
     * K=black house, W/R/G/B=diamond, .=background.
     * Smoke is not in the grid; spawned above the roof.
     * Side-by-side reference (optional): Gemini_Generated_Image_htu4shhtu4shhtu4-0bafc71e-a55b-4715-9977-ca9a119d8bbd.png in Cursor assets.
     */
    const ART = [
      ".....KKK.....",
      "....KKKKK....",
      "...KKKKKKK...",
      "..KKKKKKKKK..",
      ".KKKKKKKKKKK.",
      "KKKKKKKKKKKKK",
      "KK..BBBBB..KK",
      "KK.BGRWRGB.KK",
      "KK.BRGWGRB.KK",
      "KK.BGRWRGB.KK",
      "KK..BBBBB..KK",
      "KKKKKKKKKKKKK",
      "KKKKKKKKKKKKK",
      "KKKKKKKKKKKKK",
    ];

    /** Chimney-ish region: logical coords for smoke birth / reset */
    const SMOKE_SPAWNS = [
      { x: 6, y: -0.8 },
      { x: 7, y: -1.2 },
      { x: 8, y: -0.6 },
      { x: 9, y: -1.0 },
      { x: 7, y: -2.0 },
      { x: 8, y: -2.4 },
    ];

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const GW = ART[0].length;
    const GH = ART.length;
    const pad = 2;
    const logicalW = GW + pad * 2;
    const logicalH = GH + pad * 2 + 4;

    canvas.width = Math.floor(logicalW * PIXEL_SIZE);
    canvas.height = Math.floor(logicalH * PIXEL_SIZE);

    function parseCells() {
      const cells = [];
      for (let y = 0; y < GH; y++) {
        const row = ART[y];
        for (let x = 0; x < GW; x++) {
          const ch = row[x];
          if (ch !== ".") cells.push({ x, y, ch });
        }
      }
      return cells;
    }

    /**
     * One continuous path through every silhouette cell (K/W/R/G/B): serpentine
     * row scan (alternating L→R / R→L) so the snake visits the whole house including the diamond.
     */
    function buildSnakePath() {
      const path = [];
      const key = (x, y) => y + "," + x;
      const cellAt = new Map();
      for (let y = 0; y < GH; y++) {
        for (let x = 0; x < GW; x++) {
          const ch = ART[y][x];
          if (ch !== ".") cellAt.set(key(x, y), { x, y, ch });
        }
      }
      for (let y = 0; y < GH; y++) {
        const xs = y % 2 === 0 ? [...Array(GW).keys()] : [...Array(GW).keys()].reverse();
        for (const x of xs) {
          if (cellAt.has(key(x, y))) path.push(cellAt.get(key(x, y)));
        }
      }
      return path;
    }

    const SNAKE_PATH = buildSnakePath();
    const smokeParticles = SMOKE_SPAWNS.map((s, i) => ({
      x: s.x + pad,
      y: s.y + pad,
      phase: i * 1.7,
      seed: i * 0.31,
    }));

    let head = 0;
    let t0 = performance.now();

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function pulseFactor(now) {
      const t = (now - t0) / 1000;
      return 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(2 * Math.PI * PULSE_HZ * t));
    }

    function snakeEmphasis(now) {
      const c = Math.floor(now / SNAKE_EMPHASIS_EVERY_MS);
      const local = now - c * SNAKE_EMPHASIS_EVERY_MS;
      return local < SNAKE_EMPHASIS_MS;
    }

    function drawPixel(lx, ly, rgb, alpha = 1) {
      const x = Math.floor(lx * PIXEL_SIZE);
      const y = Math.floor(ly * PIXEL_SIZE);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;
      ctx.fillRect(x, y, PIXEL_SIZE, PIXEL_SIZE);
      ctx.globalAlpha = 1;
    }

    function modulate(rgb, ch, factor) {
      if (ch === "K") return rgb;
      const f = lerp(0.75, 1.15, factor);
      return [rgb[0] * f, rgb[1] * f, rgb[2] * f];
    }

    function frame(now) {
      const dt = (now - (frame._last || now)) / 1000;
      frame._last = now;

      const pulse = pulseFactor(now);
      const emph = snakeEmphasis(now);
      head = (head + SNAKE_CELLS_PER_SEC * dt) % SNAKE_PATH.length;

      const snakeSet = new Set();
      for (let k = 0; k < SNAKE_LENGTH; k++) {
        const i = (Math.floor(head) - k + SNAKE_PATH.length * 10) % SNAKE_PATH.length;
        const p = SNAKE_PATH[i];
        snakeSet.add(p.x + "," + p.y);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < GH; y++) {
        for (let x = 0; x < GW; x++) {
          const ch = ART[y][x];
          if (ch === ".") continue;
          const lx = x + pad;
          const ly = y + pad;
          let rgb = COLORS[ch] || COLORS.K;
          rgb = modulate(rgb, ch, pulse);
          let alpha = 1;
          if (emph && ch !== "." && snakeSet.has(x + "," + y) === false) alpha = 0.28;
          drawPixel(lx, ly, rgb, alpha);
        }
      }

      if (emph) {
        for (let k = 0; k < SNAKE_LENGTH; k++) {
          const i = (Math.floor(head) - k + SNAKE_PATH.length * 10) % SNAKE_PATH.length;
          const p = SNAKE_PATH[i];
          const lx = p.x + pad;
          const ly = p.y + pad;
          const headRgb = k === 0 ? [255, 255, 120] : [255, 220, 60];
          drawPixel(lx, ly, headRgb, 1);
        }
      }

      const tSec = now / 1000;
      for (const s of smokeParticles) {
        s.y -= SMOKE_RISE_PER_SEC * dt * (0.85 + s.seed * 0.3);
        s.x += Math.sin(tSec * SMOKE_DRIFT + s.phase) * 0.35 * dt * 60;
        if (s.y < -2) {
          const sp = SMOKE_SPAWNS[(Math.random() * SMOKE_SPAWNS.length) | 0];
          s.x = sp.x + pad + (Math.random() - 0.5) * 0.6;
          s.y = sp.y + pad;
        }
        drawPixel(s.x, s.y, COLORS.K, 0.92);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
