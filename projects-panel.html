<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 300px;
      height: 360px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #panel {
      height: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      padding: 12px 14px 10px;
      color: #000000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }
    input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #000000;
      border-radius: 0;
      color: #000000;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 2px 8px;
      outline: none;
      width: 100%;
      flex-shrink: 0;
    }
    input::placeholder { color: rgba(0, 0, 0, 0.35); font-weight: 600; }
    #dir-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #dir-label {
      font-size: 11px;
      font-weight: 500;
      color: #000000;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 0;
      transition: background 0.1s, color 0.1s;
    }
    #dir-label:hover { background: #000000; color: #ffffff; }
    #status {
      font-size: 11px;
      font-weight: 500;
      color: #000000;
      flex-shrink: 0;
    }
    #status.found { color: #2a7d00; }
    #status.error { color: #c0392b; }
    #status.busy  { color: #000000; }
    #status.copied { color: #1a6bbf; }
    #results {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }
    #results::-webkit-scrollbar { width: 4px; }
    #results::-webkit-scrollbar-track { background: transparent; }
    #results::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 0;
    }
    .result-row {
      display: flex;
      align-items: center;
      padding: 6px 4px;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.1s, color 0.1s;
    }
    .result-row:hover { background: #000000; color: #ffffff; }
    .result-row .info { flex: 1; min-width: 0; overflow: hidden; }
    .result-row .name {
      font-size: 12px;
      font-weight: 700;
      color: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Prefix may shrink + ellipsis; tail stays fully visible (avoid end-ellipsis on whole line). */
    .result-row .rel {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      min-width: 0;
      max-width: 100%;
      font-size: 10px;
      font-weight: 500;
      color: inherit;
      margin-top: 1px;
      opacity: 0.6;
    }
    .result-row .rel .path-prefix {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.85;
      font-weight: 500;
    }
    .result-row .rel .path-tail {
      flex: 0 0 auto;
      white-space: nowrap;
      font-weight: 700;
      opacity: 1;
    }
    .result-row:hover .rel .path-prefix { opacity: 0.95; }
    .result-group {
      margin-bottom: 10px;
    }
    .result-group:last-child { margin-bottom: 0; }
    .result-group-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: rgba(0, 0, 0, 0.45);
      padding: 4px 4px 2px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      margin-bottom: 2px;
    }
    .open-btn {
      opacity: 0;
      font-size: 13px;
      font-weight: 600;
      color: inherit;
      padding: 2px 4px;
      border-radius: 0;
      flex-shrink: 0;
      transition: opacity 0.1s;
      line-height: 1;
    }
    .result-row:hover .open-btn { opacity: 1; }
    #hint {
      font-size: 11px;
      font-weight: 500;
      color: rgba(0,0,0,0.35);
      text-align: center;
      padding: 24px 0 0;
      line-height: 1.7;
    }
    #hint code {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 10px;
      background: rgba(0,0,0,0.06);
      border-radius: 0;
      padding: 1px 4px;
    }
  </style>
</head>
<body>
  <div id="panel">
    <input id="pattern" type="text" placeholder="**/*.ts" autocomplete="off" spellcheck="false" autofocus>
    <div id="dir-row">
      <span id="dir-label">~/Projects</span>
    </div>
    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const patternInput = document.getElementById('pattern');
    const dirLabel     = document.getElementById('dir-label');
    const statusEl     = document.getElementById('status');
    const resultsEl    = document.getElementById('results');

    let currentDir    = null;
    let debounceTimer = null;
    let statusTimer   = null;

    function shortenPath(p) {
      return p.replace(/^\/Users\/[^/]+/, '~');
    }

    function escapeHtml(s) {
      if (typeof s !== 'string') return '';
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /** First folder segment under search root, or `__root__` if the hit is directly in root. */
    function groupKeyForRel(rel) {
      const i = rel.indexOf('/');
      if (i === -1) return '__root__';
      return rel.slice(0, i);
    }

    function pathBelowTopFolder(rel, key) {
      if (key === '__root__') return rel;
      return rel.slice(key.length + 1);
    }

    /** Dimmed prefix (left-truncated) + bold last 1–2 path segments. */
    function formatPathTail(relForTail, maxPrefixChars) {
      const max = maxPrefixChars == null ? 28 : maxPrefixChars;
      const parts = relForTail.split('/').filter(Boolean);
      if (parts.length === 0) return '';
      const tailParts = parts.length >= 2 ? 2 : 1;
      const tail = parts.slice(-tailParts).join('/');
      const prefix = parts.slice(0, -tailParts).join('/');
      let prefixShown = prefix;
      if (prefixShown.length > max) {
        prefixShown = '…' + prefixShown.slice(-(max - 1));
      }
      const pEsc = prefixShown ? escapeHtml(prefixShown + '/') : '';
      const tEsc = escapeHtml(tail);
      if (!pEsc) {
        return `<span class="path-tail">${tEsc}</span>`;
      }
      return `<span class="path-prefix">${pEsc}</span><span class="path-tail">${tEsc}</span>`;
    }

    function compareGroupKeys(a, b) {
      if (a === '__root__') return 1;
      if (b === '__root__') return -1;
      return a.localeCompare(b, undefined, { sensitivity: 'base' });
    }

    function setStatus(text, cls) {
      clearTimeout(statusTimer);
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    function flashStatus(text, cls, duration) {
      setStatus(text, cls);
      statusTimer = setTimeout(() => setStatus(''), duration);
    }

    async function initDir() {
      const def = await window.panelAPI.getDefaultDir(); // e.g. /Users/Till/Projects
      currentDir = def.substring(0, def.lastIndexOf('/')) || def; // → /Users/Till
      dirLabel.textContent = shortenPath(currentDir);
    }

    dirLabel.addEventListener('click', async () => {
      const picked = await window.panelAPI.pickDirectory();
      if (picked) {
        currentDir = picked;
        dirLabel.textContent = shortenPath(currentDir);
        if (patternInput.value.trim()) runGlob();
      }
    });

    function render({ files, error }) {
      resultsEl.innerHTML = '';

      if (error) {
        resultsEl.innerHTML = `<div id="hint">${escapeHtml(error)}</div>`;
        return;
      }
      if (files.length === 0) {
        resultsEl.innerHTML = '<div id="hint">No matches</div>';
        return;
      }

      const groups = new Map();
      for (const item of files) {
        const key = groupKeyForRel(item.rel);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }

      const keys = [...groups.keys()].sort(compareGroupKeys);
      for (const key of keys) {
        const items = groups.get(key);
        items.sort((a, b) => a.rel.localeCompare(b.rel, undefined, { sensitivity: 'base' }));

        const groupEl = document.createElement('div');
        groupEl.className = 'result-group';

        const labelEl = document.createElement('div');
        labelEl.className = 'result-group-label';
        labelEl.textContent = key === '__root__' ? 'Here' : key;
        groupEl.appendChild(labelEl);

        for (const item of items) {
          const row = document.createElement('div');
          row.className = 'result-row';
          row.title = item.rel;

          const belowTop = pathBelowTopFolder(item.rel, key);
          const relHtml = formatPathTail(belowTop);

          const info = document.createElement('div');
          info.className = 'info';
          info.innerHTML = `<div class="name">${escapeHtml(item.name)}</div><div class="rel">${relHtml}</div>`;

          const btn = document.createElement('span');
          btn.className = 'open-btn';
          btn.textContent = '↗';
          btn.title = 'Open folder in Terminal';
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const dir = item.abs.replace(/\/[^/]+$/, '') || currentDir;
            window.panelAPI.openProject(dir);
          });

          row.appendChild(info);
          row.appendChild(btn);

          row.addEventListener('click', () => {
            window.panelAPI.copyToClipboard(item.rel);
            flashStatus('Copied!', 'copied', 1500);
          });

          groupEl.appendChild(row);
        }

        resultsEl.appendChild(groupEl);
      }
    }

    async function runGlob() {
      const raw = patternInput.value.trim();
      const pattern = raw && !/[*?{]/.test(raw) ? `**/${raw}` : raw;
      if (!pattern) {
        setStatus('');
        resultsEl.innerHTML = '<div id="hint">Type a glob pattern<br><code>**/*.ts</code> &nbsp; <code>src/**/*.test.*</code></div>';
        return;
      }
      setStatus('Matching…', 'busy');
      let result = { files: [], error: null };
      try {
        result = await window.panelAPI.runGlob(pattern, currentDir);
      } catch {
        setStatus('');
        render({ files: [], error: null });
        return;
      }
      if (result.error) {
        setStatus('');
      } else {
        setStatus(
          result.files.length > 0
            ? `${result.files.length} file${result.files.length !== 1 ? 's' : ''} matched  ·  click to copy path`
            : '',
          result.files.length > 0 ? 'found' : ''
        );
      }
      render(result);
    }

    patternInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runGlob, 350);
    });

    patternInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { clearTimeout(debounceTimer); runGlob(); }
      if (e.key === 'Escape') window.panelAPI.closePanel();
    });

    resultsEl.innerHTML = '<div id="hint">Type a glob pattern<br><code>**/*.ts</code> &nbsp; <code>src/**/*.test.*</code></div>';
    initDir();
  </script>
</body>
</html>
