<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greg</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 200px;
      height: 200px;
      background: #f5f5f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <canvas id="c" width="160" height="160"></canvas>

  <script>
    const sources = [
      'Group 5.png',
      'Group 6.png',
      'Group 7.png',
      'Group 8.png',
      'Group 9.png',
      'Group 10.png',
    ];

    // max natural dimensions across all frames — used as the reference scale
    const MAX_W = 806;
    const MAX_H = 682;

    const CANVAS_SIZE = 160;
    const scale = CANVAS_SIZE / Math.max(MAX_W, MAX_H);

    const delays = [150, 150, 150, 150, 150, 150];

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // load all images first
    const imgs = [];
    let loaded = 0;

    sources.forEach((src, i) => {
      const img = new Image();
      img.src = src;
      img.onload = () => {
        loaded++;
        if (loaded === sources.length) start();
      };
      imgs[i] = img;
    });

    let current = 0;

    function draw(i) {
      const img = imgs[i];
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      const x = (CANVAS_SIZE - w) / 2;   // centered horizontally
      const y = CANVAS_SIZE - h;          // bottom-aligned — same ground line

      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.drawImage(img, x, y, w, h);
    }

    function start() {
      draw(0);

      function next() {
        current = (current + 1) % imgs.length;
        draw(current);
        setTimeout(next, delays[current]);
      }

      setTimeout(next, delays[0]);
    }
  </script>
</body>
</html>
