<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greb & Glob</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    body.shrunk {
      width: 200px;
      height: 200px;
    }
    body.expanded {
      width: 100%;
      height: 100%;
    }
    #column {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    body.shrunk #column {
      align-items: center;
      justify-content: center;
    }
    #shrineRow {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body.expanded #shrineRow {
      padding: 10px 0 6px;
      -webkit-app-region: drag;
    }
    #wrapper {
      position: relative;
      width: 160px;
      height: 160px;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: grab;
      -webkit-app-region: no-drag;
    }
    canvas:active { cursor: grabbing; }
    #badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0;
      color: #e8e8e8;
      font-family: monospace;
      font-size: 10px;
      padding: 2px 6px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #badge.visible { opacity: 1; }
    #badge.error { color: #ff6b6b; border-color: rgba(255,107,107,0.4); }
    #chromeBar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.1);
      background: rgba(12, 12, 12, 0.92);
      transition: height 0.22s ease, opacity 0.18s ease, min-height 0.22s ease;
    }
    body.shrunk #chromeBar {
      height: 0;
      min-height: 0;
      opacity: 0;
      pointer-events: none;
      border-top-color: transparent;
    }
    body.expanded #chromeBar {
      height: 14px;
      min-height: 14px;
      opacity: 1;
      pointer-events: auto;
      -webkit-app-region: drag;
    }
    #closeTerm {
      -webkit-app-region: no-drag;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.75);
      font-size: 16px;
      line-height: 1;
      padding: 0 4px;
      cursor: pointer;
      border-radius: 2px;
    }
    #closeTerm:hover {
      color: #fff;
      background: rgba(255,255,255,0.1);
    }
    #terminalWrap {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #1e1e1e;
      transition: flex 0.22s ease, opacity 0.2s ease;
    }
    body.shrunk #terminalWrap {
      flex: 0 0 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }
    body.expanded #terminalWrap {
      flex: 1 1 auto;
      opacity: 1;
      pointer-events: auto;
      overflow: hidden;
    }
    #terminal {
      flex: 1 1 auto;
      min-height: 0;
      padding: 4px 6px 8px;
    }
    body.expanded #terminal .xterm {
      height: 100%;
    }
  </style>
</head>
<body class="shrunk">
  <div id="column">
    <div id="shrineRow">
      <div id="wrapper">
        <canvas id="c" width="160" height="160"></canvas>
        <div id="badge"></div>
      </div>
    </div>
    <div id="chromeBar">
      <button type="button" id="closeTerm" aria-label="Close terminal">×</button>
    </div>
    <div id="terminalWrap">
      <div id="terminal"></div>
    </div>
  </div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="shrine-terminal.js"></script>

  <script>
    const sources = [
      'assets/Group 5.png',   // 0
      'assets/Group 6.png',   // 1 — grep frame
      'assets/Group 7.png',   // 2
      'assets/Group 8.png',   // 3 — glob frame
      'assets/Group 9.png',   // 4
      'assets/Group 10.png',  // 5 — idle frame
    ];

    const FRAME = { idle: 5, grep: 1, glob: 3, error: 0 };
    const MAX_W = 806, MAX_H = 682, CANVAS_SIZE = 160;
    const FRAME_DELAY = 150;
    const scale = CANVAS_SIZE / Math.max(MAX_W, MAX_H);

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const badge  = document.getElementById('badge');

    const imgs = [];
    let loaded = 0;
    sources.forEach((src, i) => {
      const img = new Image();
      img.src = src;
      img.onload = () => { if (++loaded === sources.length) start(); };
      imgs[i] = img;
    });

    let loopTimer  = null;
    let active     = false;
    let started    = false;
    let lockedFrame = null;
    let badgeTimer = null;
    let current    = FRAME.idle;

    function draw(i) {
      const img = imgs[i];
      const w = img.naturalWidth * scale;
      const h = img.naturalHeight * scale;
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.drawImage(img, (CANVAS_SIZE - w) / 2, CANVAS_SIZE - h, w, h);
    }

    function startLoop() {
      if (active || lockedFrame !== null) return;
      active = true;
      current = 0;
      function next() {
        if (!active) return;
        draw(current);
        current = (current + 1) % imgs.length;
        loopTimer = setTimeout(next, FRAME_DELAY);
      }
      next();
    }

    function stopLoop() {
      active = false;
      clearTimeout(loopTimer);
      loopTimer = null;
      if (lockedFrame !== null) draw(lockedFrame);
      else draw(FRAME.idle);
    }

    function lockFrame(i) {
      active = false;
      clearTimeout(loopTimer);
      loopTimer = null;
      lockedFrame = i;
      draw(i);
    }

    function unlock() {
      lockedFrame = null;
      current = FRAME.idle;
      draw(FRAME.idle);
    }

    function pulse() {
      const base = lockedFrame ?? FRAME.idle;
      draw((base + 1) % imgs.length);
      setTimeout(() => draw(base), 100);
    }

    window.electronAPI.onShrineState((state) => {
      if      (state === 'idle')      unlock();
      else if (state === 'grep')      lockFrame(FRAME.grep);
      else if (state === 'glob')      lockFrame(FRAME.glob);
      else if (state === 'searching') { lockedFrame = null; startLoop(); }
      else if (state === 'found')     lockFrame(FRAME.grep);
      else if (state === 'error')     lockFrame(FRAME.error);
    });

    window.electronAPI.onGrepResult((result) => {
      clearTimeout(badgeTimer);
      badge.className = 'visible' + (result.error ? ' error' : '');
      badge.textContent = result.error
        ? '!'
        : `${result.count} match${result.count !== 1 ? 'es' : ''}`;
      badgeTimer = setTimeout(() => {
        badge.className = '';
      }, 8000);
    });

    function start() {
      if (started) return;
      started = true;
      draw(FRAME.idle);
      if (typeof window.initShrineTerminalBridge === 'function') {
        window.initShrineTerminalBridge();
      }

      canvas.addEventListener('mouseenter', startLoop);
      canvas.addEventListener('mouseleave', stopLoop);

      canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        window.electronAPI.openContextMenu();
      });

      canvas.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;

        const startX = e.screenX, startY = e.screenY;
        const offsetX = e.screenX - window.screenX;
        const offsetY = e.screenY - window.screenY;
        let dragged = false;

        function onMove(ev) {
          if (Math.abs(ev.screenX - startX) > 5 || Math.abs(ev.screenY - startY) > 5) {
            dragged = true;
          }
          if (dragged) window.electronAPI.moveWindow(ev.screenX - offsetX, ev.screenY - offsetY);
        }

        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          if (dragged) window.electronAPI.shrineDragEnded(true);
          if (!dragged) {
            if (lockedFrame === null) pulse();
            window.electronAPI.openTerminal();
          }
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }
  </script>
</body>
</html>
