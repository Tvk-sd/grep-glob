<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 220px;
      height: 148px;
      background: transparent;
      overflow: hidden;
    }
    #menu {
      margin: 6px;
      background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      font-family: monospace;
      font-size: 12px;
      color: #e8e8e8;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .row:hover { background: rgba(255,255,255,0.08); }
    .row .sprite {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      image-rendering: pixelated;
    }
    .row .label { font-weight: bold; font-size: 13px; }
    .row .sub   { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 0 10px;
    }
    .system-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }
    .system-row span {
      cursor: pointer;
      transition: color 0.1s;
    }
    .system-row span:hover { color: rgba(255,255,255,0.7); }
    .system-row span.active { color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div id="menu">
    <div class="row" id="row-grep"
         data-cmd="grep"
         onmouseenter="hover('grep')"
         onmouseleave="hover(null)"
         onclick="select('grep')">
      <canvas class="sprite" id="sprite-grep" width="28" height="28"></canvas>
      <div>
        <div class="label">grep</div>
        <div class="sub">search in files</div>
      </div>
    </div>

    <div class="row" id="row-glob"
         data-cmd="glob"
         onmouseenter="hover('glob')"
         onmouseleave="hover(null)"
         onclick="select('glob')">
      <canvas class="sprite" id="sprite-glob" width="28" height="28"></canvas>
      <div>
        <div class="label">glob</div>
        <div class="sub">jump to project</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="system-row">
      <span id="btn-top" onclick="select('toggle-top')">⊙ on top</span>
      <span onclick="select('quit')">✕ quit</span>
    </div>
  </div>

  <script>
    // Load sprite frames
    const GREG_SRC = 'assets/Group 6.png';   // grep frame
    const GLOP_SRC = 'assets/Group 8.png';   // glob frame
    const MAX_W = 806, MAX_H = 682;

    function drawSprite(canvasEl, src) {
      const ctx = canvasEl.getContext('2d');
      const size = canvasEl.width;
      const sc = size / Math.max(MAX_W, MAX_H);
      const img = new Image();
      img.src = src;
      img.onload = () => {
        const w = img.naturalWidth * sc;
        const h = img.naturalHeight * sc;
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, (size - w) / 2, size - h, w, h);
      };
    }

    drawSprite(document.getElementById('sprite-grep'), GREG_SRC);
    drawSprite(document.getElementById('sprite-glob'), GLOP_SRC);

    // Reflect always-on-top state
    window.panelAPI.isAlwaysOnTop().then(on => {
      document.getElementById('btn-top').classList.toggle('active', on);
    });

    function hover(cmd) {
      window.panelAPI.menuHover(cmd);
      // Dim non-hovered rows
      document.querySelectorAll('.row').forEach(r => {
        r.style.opacity = (!cmd || r.dataset.cmd === cmd) ? '1' : '0.4';
      });
    }

    function select(cmd) {
      window.panelAPI.menuSelect(cmd);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.panelAPI.menuSelect(null);
    });
  </script>
</body>
</html>
