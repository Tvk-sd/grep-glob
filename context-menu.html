<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 220px;
      height: 132px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #menu {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 10px 10px;
      gap: 2px;
      background: transparent;
    }
    .row {
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      border-radius: 0;
      color: #000000;
      text-align: center;
    }
    .row .row-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.25;
      color: inherit;
    }
    .row:hover {
      background: #000000;
      color: #ffffff;
    }
    .system-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      align-items: center;
      margin-top: 6px;
      padding: 6px 4px 0;
      font-size: 11px;
      font-weight: 500;
    }
    .system-row span {
      cursor: pointer;
      padding: 4px 6px;
      margin: -4px -6px;
      border-radius: 0;
      transition: background 0.1s, color 0.1s;
      color: #000000;
    }
    .system-row span:hover {
      background: #000000;
      color: #ffffff;
    }
    .system-row span.active { font-weight: 600; }
  </style>
</head>
<body>
  <div id="menu">
    <div class="row" id="row-grep"
         data-cmd="grep"
         onmouseenter="hover('grep')"
         onmouseleave="hover(null)"
         onclick="select('grep')">
      <div class="row-text">grep whats next</div>
    </div>

    <div class="row" id="row-glob"
         data-cmd="glob"
         onmouseenter="hover('glob')"
         onmouseleave="hover(null)"
         onclick="select('glob')">
      <div class="row-text">glob it all up</div>
    </div>

    <div class="system-row" onmouseenter="hover('idle')">
      <span id="btn-top" onclick="select('toggle-top')">⊙ on top</span>
      <span onclick="select('quit')">✕ quit</span>
    </div>
  </div>

  <script>
    window.panelAPI.isAlwaysOnTop().then(on => {
      document.getElementById('btn-top').classList.toggle('active', on);
    });

    function hover(cmd) {
      window.panelAPI.menuHover(cmd);
    }

    function select(cmd) {
      window.panelAPI.menuSelect(cmd);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.panelAPI.menuSelect(null);
    });
  </script>
</body>
</html>
